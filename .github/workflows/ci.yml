name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel and run the CLI
        run: |
          python -m pip install dist/*.whl
          wallet-manager --version
          WALLET_MANAGER_FILE=/tmp/ks.json WALLET_MANAGER_PASSWORD='ci passphrase' \
            wallet-manager create smoke --words 12
          WALLET_MANAGER_FILE=/tmp/ks.json WALLET_MANAGER_PASSWORD='ci passphrase' \
            wallet-manager verify
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
