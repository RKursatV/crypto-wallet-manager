name: Publish to PyPI

# Runs when a GitHub release is published, or by hand from the Actions tab /
# `gh workflow run publish.yml --ref vX.Y.Z`. Uploads via PyPI Trusted
# Publishing (OIDC): no API token is stored anywhere. The trusted publisher
# must be registered on PyPI as owner=RKursatV, repo=crypto-wallet-manager,
# workflow=publish.yml, environment=pypi.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(grep -E '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v${version}" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} != package version ${version}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/crypto-wallet-manager/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
